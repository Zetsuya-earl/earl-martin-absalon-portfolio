<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absalon e-Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070d17;--panel:#0d1624;--line:#26334a;--ink:#f4efe9;--mute:#b4bfd0;--red:#ff4455;--teal:#4ff0dc;--tealdim:#12343a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Inter,system-ui,sans-serif;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px)}
h1,h2,h3{font-family:Rajdhani,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px;font:700 20px Rajdhani,sans-serif;letter-spacing:.35em}
.logo i{width:22px;height:22px;background:var(--red);transform:rotate(45deg) scale(.8)}
nav{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:12px 18px;cursor:pointer;text-align:center;font:600 18px Rajdhani,sans-serif;letter-spacing:.2em}
nav button small{display:block;font-size:12px;letter-spacing:.2em;opacity:.8}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--red)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:28px 20px 60px}
section{display:none}section.on{display:block}
.kicker{color:var(--teal);font:600 16px Rajdhani,sans-serif;letter-spacing:.3em;display:flex;align-items:center;gap:14px;margin-bottom:10px}
.kicker::before{content:"";width:40px;height:2px;background:var(--teal)}
.kicker.r{color:var(--red)}.kicker.r::before{background:var(--red)}
h1{font-size:clamp(46px,12vw,92px);font-weight:700}
h2{font-size:clamp(34px,8vw,54px);margin-bottom:22px}
.badge{display:inline-block;background:var(--red);color:#fff;font:700 18px Rajdhani,sans-serif;letter-spacing:.2em;padding:6px 16px;margin:14px 0 6px}
.sub{font:600 20px Rajdhani,sans-serif;letter-spacing:.2em;color:var(--teal);margin:0 0 22px;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);padding:22px;margin-bottom:18px}
.card h3{font-size:15px;letter-spacing:.3em;color:var(--mute);margin-bottom:12px}
.hero{display:grid;gap:28px;margin-bottom:10px}
@media(min-width:760px){.hero{grid-template-columns:260px 1fr;align-items:center}}
.portrait{position:relative;border:1px solid var(--line);background:var(--panel);aspect-ratio:3/4;display:grid;place-items:center;border-bottom:3px solid var(--red);max-width:300px;overflow:hidden}
.portrait svg{width:70%;color:#1c2b44}
.portrait span{position:absolute;bottom:14px;font:600 14px Rajdhani,sans-serif;letter-spacing:.3em;color:var(--mute)}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait img+span{background:rgba(7,13,23,.82);padding:4px 12px;white-space:nowrap}
.lvl{position:absolute;top:0;left:0;background:var(--teal);color:#05221f;font:700 16px Rajdhani,sans-serif;letter-spacing:.2em;padding:4px 12px}
.lead{max-width:60ch;color:var(--mute)}.lead strong{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid #1d6b66;background:var(--tealdim);color:var(--teal);padding:6px 14px;font-weight:500}
ul.goals{list-style:none;margin:0;padding:0;display:grid;gap:12px}
ul.goals li{display:flex;gap:14px}
ul.goals li::before{content:"";flex:0 0 14px;height:14px;margin-top:7px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--panel),inset 0 0 0 5px var(--red);border:3px solid var(--red)}
.sem{color:var(--red);font:700 20px Rajdhani,sans-serif;letter-spacing:.2em;margin:6px 0 16px;text-transform:uppercase}
.course{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px}
.course b{background:var(--teal);color:#05221f;font:700 18px Rajdhani,sans-serif;letter-spacing:.12em;padding:4px 12px}
.course h3{font-size:clamp(22px,5vw,30px)}
.art{background:var(--panel);border:1px solid var(--line);margin-bottom:24px}
.slot{position:relative;min-height:190px;display:grid;place-items:center;background:repeating-linear-gradient(135deg,#1a2335 0 14px,#151d2d 14px 28px);color:var(--mute);font:600 17px Rajdhani,sans-serif;letter-spacing:.35em;text-transform:uppercase;text-align:center;padding:20px}
.slot em{position:absolute;top:0;left:0;z-index:1;background:var(--red);color:#fff;font-style:normal;font-weight:700;letter-spacing:.2em;padding:6px 14px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.body{padding:22px}.body h3{font-size:28px}
.date{color:var(--teal);font:600 17px Rajdhani,sans-serif;letter-spacing:.25em;margin:6px 0 16px}
.lab{font:600 13px Rajdhani,sans-serif;letter-spacing:.3em;color:var(--mute);text-transform:uppercase;margin:18px 0 6px}
.body p{margin:0;color:#d3dbe8}
.so{border-left:3px solid var(--teal);background:#0f2830;color:var(--teal)!important;padding:10px 14px}
.refl{font-style:italic}
.tag{background:var(--red);color:#fff;font:700 16px Rajdhani,sans-serif;letter-spacing:.2em;padding:3px 12px;display:inline-block}
.meta{display:flex;gap:14px;align-items:center;margin:10px 0 14px;color:var(--mute);letter-spacing:.15em}
.skills{display:grid;gap:14px}
.sk{display:grid;grid-template-columns:160px 1fr;gap:14px;align-items:center}
.bar{height:10px;background:#18233a;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--teal))}
@media(max-width:480px){.sk{grid-template-columns:1fr;gap:6px}}
.empty{color:var(--mute)}
/* editing */
.edbtn{background:none;border:1px solid var(--teal);color:var(--teal);padding:8px 16px;font:600 16px Rajdhani,sans-serif;letter-spacing:.2em;cursor:pointer}
.ed{border:1px solid var(--line);background:#0a111d;padding:14px;margin:0 0 14px}
label{display:block;margin:0 0 12px;color:var(--mute);font-size:14px}
input,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:10px;font:inherit;margin-top:4px}
.btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:9px 18px;font:600 16px Rajdhani,sans-serif;letter-spacing:.15em;cursor:pointer;margin:0 8px 8px 0}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}
.btn.d{color:var(--red);border-color:var(--red)}
#login{position:fixed;inset:0;z-index:20;background:rgba(3,7,13,.88);display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red);padding:24px}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
#msg{color:var(--mute);font-size:14px}
</style>
</head>

squads:()=>`<div class="kicker r">Organizational involvement &amp; engagement</div><h2>Squads</h2>`+(D.squads.map(s=>`<article class="art">${slot(s.img,"Add evidence")}<div class="body"><h3>${e(s.name)}</h3><div class="meta"><span class="tag">${e(s.role)}</span>${e(s.sy)}</div><p>${e(s.desc)}</p><div class="lab">Reflection</div><p class="refl">${e(s.refl)}</p></div></article>`).join("")||`<p class="empty">No organizations yet.</p>`),

function render(){
  nav.innerHTML=TABS.map(([id,t,s])=>`<button role="tab" id="t-${id}" data-id="${id}">${t}<small>${s}</small></button>`).join("");
  app.innerHTML=TABS.map(([id])=>`<section id="s-${id}" role="tabpanel">${V[id]()}</section>`).join("");
  document.title="Absalon e-Portfolio";show(location.hash.slice(1),true);
}
function show(id,keep){
  if(!V[id])id="lobby";
  TABS.forEach(([t])=>{document.getElementById("s-"+t).classList.toggle("on",t===id);document.getElementById("t-"+t).setAttribute("aria-selected",t===id)});
  if(!keep)window.scrollTo(0,0);
}
nav.addEventListener("click",ev=>{const b=ev.target.closest("button");if(b)location.hash=b.dataset.id});
addEventListener("hashchange",()=>show(location.hash.slice(1)));

/* ---------- editor ---------- */
const F=(p,l,t="t")=>{const v=get(p),a=`data-p="${p}"`;
 if(t==="a")return `<label>${l}<textarea ${a} rows="3">${e(v)}</textarea></label>`;
 if(t==="l")return `<label>${l} (one per line)<textarea ${a} data-l="1" rows="3">${e(v.join("\n"))}</textarea></label>`;
 if(t==="n")return `<label>${l} (0 to 100)<input type="number" min="0" max="100" ${a} data-n="1" value="${v}"></label>`;
 if(t==="i")return `<label>${l} (paste an image link${ASSETS?" or upload below":""})<input ${a} value="${e(v)}">${ASSETS?`<input type="file" accept="image/*" data-up="${p}">`:""}</label>`;
 return `<label>${l}<input ${a} value="${e(v)}"></label>`};
const L=(p,title,item)=>`<div class="card"><h3>${title}</h3>${get(p).map((x,i)=>`<div class="ed">${item(p+"."+i)}<button class="btn d" data-del="${p}:${i}">Remove</button></div>`).join("")}<button class="btn" data-add="${p}">Add</button></div>`;
const NEW={acts:()=>({sem:"New semester",courses:[]}),courses:()=>({code:"CODE",name:"Course name",artifacts:[]}),artifacts:()=>({title:"New artifact",date:"",img:"",link:"",desc:"",so:"",refl:""}),squads:()=>({name:"Organization",role:"Member",sy:"",img:"",desc:"",refl:""}),accolades:()=>({title:"Certificate",status:"",desc:"",img:""}),tech:()=>({n:"Skill",p:30}),soft:()=>({n:"Skill",p:30})};
function editor(){
 const m=(k,l,t)=>F("me."+k,l,t);
 const bar=`<div class="savebar"><button class="btn p" data-save>Save changes</button><button class="btn" data-cancel>Cancel</button><span id="msg"></span></div>`;
 const sk=p=>q=>F(q+".n","Skill")+F(q+".p","Level","n");
 return `<div class="kicker r">Owner mode</div><h2>Edit content</h2>
<div class="card"><h3>Profile</h3>${m("name","Name")}${m("section","Section")}${m("year","Year level")}${m("program","Program")}${m("school","School")}${m("photo","Professional photo","i")}${m("purpose","Purpose of this e-portfolio","a")}${m("expect","What readers will learn","a")}${m("bio","Biography","a")}${m("background","Background","a")}${m("interests","Interests","l")}${m("goals","Goals","l")}</div>`
 +L("acts","Semesters",p=>F(p+".sem","Semester and school year")+L(p+".courses","Courses",q=>F(q+".code","Course code")+F(q+".name","Course name")+L(q+".artifacts","Artifacts",r=>F(r+".title","Title")+F(r+".date","Date")+F(r+".img","Image","i")+F(r+".link","Link to prototype, documentation or demo")+F(r+".desc","Description","a")+F(r+".so","Student outcome demonstrated")+F(r+".refl","Reflection","a"))))
 +L("squads","Organizations",p=>F(p+".name","Organization")+F(p+".role","Role")+F(p+".sy","School year")+F(p+".img","Evidence image","i")+F(p+".desc","Description","a")+F(p+".refl","Reflection","a"))
 +L("accolades","Accolades",p=>F(p+".title","Title")+F(p+".status","Status or date")+F(p+".desc","Description","a")+F(p+".img","Certificate image","i"))
 +L("skills.tech","Technical skills",sk())+L("skills.soft","Soft skills",sk())+bar;
}
function openEd(){app.hidden=true;nav.hidden=true;ed.hidden=false;ed.innerHTML=editor();window.scrollTo(0,0)}
function closeEd(){ed.hidden=true;app.hidden=false;nav.hidden=false;render()}
ed.addEventListener("input",ev=>{const t=ev.target,p=t.dataset.p;if(!p)return;let v=t.value;if(t.dataset.l)v=v.split("\n").map(s=>s.trim()).filter(Boolean);if(t.dataset.n)v=Math.max(0,Math.min(100,+v||0));set(p,v)});
ed.addEventListener("change",async ev=>{const t=ev.target,p=t.dataset.up;if(!p||!t.files[0]||!ASSETS)return;
 const msg=document.getElementById("msg");msg.textContent="Uploading image...";
 try{const r=await ASSETS.upload(t.files[0]);set(p,r.url);ed.innerHTML=editor();document.getElementById("msg").textContent="Image added. Save changes to keep it."}catch(x){msg.textContent="Upload failed: "+(x.message||x.code||"try a smaller image")}});
ed.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;
 if(b.dataset.add){get(b.dataset.add).push(NEW[b.dataset.add.split(".").pop()]());ed.innerHTML=editor()}
 else if(b.dataset.del){const[p,i]=b.dataset.del.split(":");get(p).splice(+i,1);ed.innerHTML=editor()}
 else if(b.dataset.cancel!==undefined){D=JSON.parse(ORIG);closeEd()}
 else if(b.dataset.save!==undefined){
  const msg=document.getElementById("msg");msg.textContent="Saving...";
  const j=JSON.stringify(D).replace(/</g,"\\u003c");
  const out=SRC.replace(/(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/,(m,a,c)=>a+j+c);
  try{if(ART){await ART.publish(out)}else{const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([out],{type:"text/html"}));l.download="absalon-eportfolio.html";l.click();msg.textContent="Downloaded the updated file. Upload it to your host to publish the changes."}}catch(x){msg.textContent=x.code==="conflict"?"Someone saved first. The page will reload.":"Could not save: "+(x.message||x.code||"try again")}
 }});
const HASH="dca2a56b06f18b4e9ee92d3b10ebfdc2aec4ed640d3264675e65673d0996a9e8";
const $=id=>document.getElementById(id);
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function openLogin(){$("lm").textContent="";$("lp").value="";$("login").hidden=false;$("lu").focus()}
$("editBtn").addEventListener("click",openLogin);
$("lx").addEventListener("click",()=>{$("login").hidden=true});
$("login").addEventListener("keydown",ev=>{if(ev.key==="Enter")$("lgo").click();if(ev.key==="Escape")$("lx").click()});
$("lgo").addEventListener("click",async()=>{
  const m=$("lm");m.textContent="";
  try{
    const h=await sha("portfolio-salt:"+$("lu").value.trim().toLowerCase()+":"+$("lp").value);
    if(h!==HASH){m.textContent="Wrong username or password.";return}
  }catch(x){m.textContent="Login is not available in this browser.";return}
    $("login").hidden=true;openEd();
});

render();

  const [a,u,s]=await Promise.all([claude.use("artifact"),claude.use("user"),claude.use("assets")]);
  if(a&&u&&u.canEdit()){ART=a;ASSETS=s}
}catch(x){}})();
